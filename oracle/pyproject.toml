# Tool configuration for the Python differential-test suite. Not a package:
# install with `pip install -r requirements.txt` and run from this directory.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "NPY", "PT", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["tests"]

[[tool.mypy.overrides]]
module = ["igl", "igl.*", "potpourri3d", "potpourri3d.*", "meshio", "meshio.*", "scipy", "scipy.*", "mpmath", "mpmath.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true
